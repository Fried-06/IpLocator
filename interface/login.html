<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASECNA NET-TRACE — Authentification NOC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (typeof window !== 'undefined') {
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            dark:    '#090D16',
                            card:    '#111827',
                            border:  '#1F2937',
                            emerald: { 400: '#34d399', 500: '#10b981' },
                        },
                        fontFamily: { sans: ['Inter', 'sans-serif'] },
                        animation: { 'spin-slow': 'spin 8s linear infinite' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { background: #090D16; font-family: 'Inter', sans-serif; }

        /* ── Animated topology background ── */
        .topo-bg {
            position: fixed; inset: 0; overflow: hidden; z-index: 0;
        }
        .topo-bg svg { width: 100%; height: 100%; opacity: 0.07; }

        /* Floating neon orbs */
        .orb {
            position: fixed; border-radius: 50%;
            filter: blur(80px); animation: float 12s ease-in-out infinite;
            pointer-events: none; z-index: 0;
        }
        .orb-1 { width: 400px; height: 400px; background: rgba(16,185,129,0.15); top: -100px; right: -80px; animation-delay: 0s; }
        .orb-2 { width: 300px; height: 300px; background: rgba(6,182,212,0.1); bottom: -80px; left: -60px; animation-delay: -4s; }
        .orb-3 { width: 200px; height: 200px; background: rgba(99,102,241,0.1); top: 40%; left: 10%; animation-delay: -8s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50%       { transform: translateY(-30px) scale(1.05); }
        }

        /* ── Glass card ── */
        .glass-card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 60px -10px rgba(0,0,0,0.7), 0 0 40px -15px rgba(16,185,129,0.15);
        }

        /* ── Animated border on card ── */
        .card-glow::before {
            content: '';
            position: absolute; inset: -1px;
            border-radius: inherit;
            background: conic-gradient(from var(--angle, 0deg), transparent 60%, rgba(16,185,129,0.3) 75%, rgba(6,182,212,0.2) 85%, transparent 100%);
            animation: rotate-border 4s linear infinite;
            z-index: -1;
        }
        @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
        @keyframes rotate-border { to { --angle: 360deg; } }

        /* ── Input fields ── */
        .noc-input {
            width: 100%; padding: 12px 14px 12px 46px;
            background: rgba(9, 13, 22, 0.8);
            border: 1px solid #1F2937;
            border-radius: 10px; color: #e5e7eb;
            font-size: 14px; font-family: 'Inter', sans-serif;
            transition: all 0.25s ease; outline: none;
        }
        .noc-input:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16,185,129,0.2), 0 0 20px rgba(16,185,129,0.1);
        }
        .noc-input::placeholder { color: #4b5563; }

        /* ── Submit button ── */
        .btn-login {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, #059669 0%, #0891b2 100%);
            border: none; border-radius: 10px;
            color: white; font-weight: 700; font-size: 15px; letter-spacing: 0.5px;
            cursor: pointer; transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(16,185,129,0.35);
            position: relative; overflow: hidden;
        }
        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 30px rgba(16,185,129,0.5);
        }
        .btn-login:active { transform: translateY(0); }
        .btn-login::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
        }

        /* ── Role pills ── */
        .role-pill {
            font-size: 11px; font-family: 'Roboto Mono', monospace; font-weight: 500;
            padding: 3px 10px; border-radius: 20px; border: 1px solid;
            display: inline-flex; align-items: center; gap: 5px;
        }
        .role-admin { background: rgba(16,185,129,0.1); color: #34d399; border-color: rgba(16,185,129,0.3); }
        .role-op    { background: rgba(245,158,11,0.1); color: #fbbf24; border-color: rgba(245,158,11,0.3); }

        /* ── Error banner ── */
        .error-banner {
            background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
            color: #f87171; border-radius: 8px; padding: 10px 14px;
            font-size: 13px; display: flex; align-items: center; gap: 8px;
        }

        /* ── Separator ── */
        .sep { height: 1px; background: linear-gradient(to right, transparent, #1F2937, transparent); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Topology background -->
    <div class="topo-bg" aria-hidden="true">
        <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
            <defs>
                <radialGradient id="grd" cx="50%" cy="50%" r="50%">
                    <stop offset="0%"   stop-color="#10b981" stop-opacity="0.4"/>
                    <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
                </radialGradient>
            </defs>
            <!-- Grid lines horizontal -->
            <g stroke="#10b981" stroke-width="0.5">
                <line x1="0" y1="150" x2="1440" y2="150"/>
                <line x1="0" y1="300" x2="1440" y2="300"/>
                <line x1="0" y1="450" x2="1440" y2="450"/>
                <line x1="0" y1="600" x2="1440" y2="600"/>
                <line x1="0" y1="750" x2="1440" y2="750"/>
                <!-- Grid lines vertical -->
                <line x1="180" y1="0" x2="180" y2="900"/>
                <line x1="360" y1="0" x2="360" y2="900"/>
                <line x1="540" y1="0" x2="540" y2="900"/>
                <line x1="720" y1="0" x2="720" y2="900"/>
                <line x1="900" y1="0" x2="900" y2="900"/>
                <line x1="1080" y1="0" x2="1080" y2="900"/>
                <line x1="1260" y1="0" x2="1260" y2="900"/>
            </g>
            <!-- Network topology links -->
            <g stroke="#06b6d4" stroke-width="1" stroke-dasharray="6,10" opacity="0.6">
                <line x1="720" y1="450" x2="360" y2="225"/>
                <line x1="720" y1="450" x2="1080" y2="225"/>
                <line x1="360" y1="225" x2="180" y2="450"/>
                <line x1="360" y1="225" x2="540" y2="600"/>
                <line x1="1080" y1="225" x2="900" y2="600"/>
                <line x1="1080" y1="225" x2="1260" y2="450"/>
            </g>
            <!-- Nodes -->
            <g fill="#10b981">
                <circle cx="720" cy="450" r="8" opacity="0.9"/>
                <circle cx="360" cy="225" r="5" opacity="0.7"/>
                <circle cx="1080" cy="225" r="5" opacity="0.7"/>
                <circle cx="180" cy="450" r="4" opacity="0.5"/>
                <circle cx="540" cy="600" r="4" opacity="0.5"/>
                <circle cx="900" cy="600" r="4" opacity="0.5"/>
                <circle cx="1260" cy="450" r="4" opacity="0.5"/>
            </g>
        </svg>
    </div>

    <!-- Orbs -->
    <div class="orb orb-1" aria-hidden="true"></div>
    <div class="orb orb-2" aria-hidden="true"></div>
    <div class="orb orb-3" aria-hidden="true"></div>

    <!-- Login Card -->
    <div class="glass-card card-glow relative rounded-2xl w-full max-w-md p-8 z-10" style="position: relative;">

        <!-- Header : Logo ASECNA -->
        <div class="flex flex-col items-center mb-8">
            <img src="../image/Logo_ASECNA.png" alt="Logo ASECNA" class="h-16 w-auto mb-4 drop-shadow-lg"
                 onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex'">
            <!-- Fallback si logo absent -->
            <div id="logo-fallback" class="hidden items-center justify-center w-16 h-16 rounded-xl bg-emerald-500/10 border border-emerald-500/30 mb-4">
                <i class="fa-solid fa-tower-broadcast text-emerald-400 text-2xl"></i>
            </div>

            <h1 class="text-white font-bold text-2xl tracking-wide">
                NET<span class="text-emerald-400">-</span>TRACE
            </h1>
            <p class="text-gray-500 text-xs mt-1 tracking-widest uppercase">ASECNA · NOC Supervision Platform</p>
        </div>

        <!-- Separator -->
        <div class="sep mb-7"></div>

        <!-- Error message -->
        <div id="error-msg" class="error-banner mb-5 hidden">
            <i class="fa-solid fa-triangle-exclamation flex-shrink-0"></i>
            <span id="error-text"></span>
        </div>

        <!-- Form -->
        <form id="login-form" novalidate>
            <!-- Identifiant -->
            <div class="relative mb-4">
                <div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
                <input type="text" id="input-id" class="noc-input" placeholder="Identifiant NOC" autocomplete="username" required>
            </div>

            <!-- Mot de passe -->
            <div class="relative mb-6">
                <div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </div>
                <input type="password" id="input-pwd" class="noc-input" placeholder="Mot de passe" autocomplete="current-password" required>
                <!-- Toggle visibility -->
                <button type="button" id="toggle-pwd" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-600 hover:text-gray-400 transition-colors">
                    <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>

            <!-- Submit -->
            <button type="submit" id="btn-login" class="btn-login">
                <span class="relative z-10 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-shield-halved"></i>
                    SE CONNECTER
                </span>
            </button>
        </form>

        <!-- Separator -->
        <div class="sep my-6"></div>

        <!-- Demo credentials -->
        <div>
            <p class="text-gray-600 text-[10px] uppercase tracking-widest text-center mb-3">Comptes de démonstration</p>
            <div class="grid grid-cols-2 gap-3">
                <button type="button" class="demo-btn text-left p-3 rounded-lg bg-[#0B1120] border border-[#1F2937] hover:border-emerald-500/30 transition-all group"
                        data-id="admin" data-pwd="admin123">
                    <div class="flex items-center gap-2 mb-1.5">
                        <div class="w-5 h-5 rounded-full bg-emerald-500/20 flex items-center justify-center">
                            <i class="fa-solid fa-crown text-emerald-400 text-[8px]"></i>
                        </div>
                        <span class="role-pill role-admin">ADMIN</span>
                    </div>
                    <p class="text-gray-400 text-xs font-mono">admin / admin123</p>
                </button>
                <button type="button" class="demo-btn text-left p-3 rounded-lg bg-[#0B1120] border border-[#1F2937] hover:border-amber-500/30 transition-all group"
                        data-id="operator" data-pwd="user123">
                    <div class="flex items-center gap-2 mb-1.5">
                        <div class="w-5 h-5 rounded-full bg-amber-500/20 flex items-center justify-center">
                            <i class="fa-solid fa-user text-amber-400 text-[8px]"></i>
                        </div>
                        <span class="role-pill role-op">OPÉRATEUR</span>
                    </div>
                    <p class="text-gray-400 text-xs font-mono">operator / user123</p>
                </button>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-gray-700 text-[10px] text-center mt-6">
            &copy; ASECNA · Direction des Systèmes d'Information · Togo
        </p>
    </div>

    <script src="ressources/js/auth.js"></script>
    <script>
        // Redirect if already logged in
        if (getSession()) window.location.href = 'index.html';

        const form = document.getElementById('login-form');
        const btnLogin = document.getElementById('btn-login');
        const msgEl = document.getElementById('error-msg');
        const msgText = document.getElementById('error-text');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('input-id').value.trim();
            const pwd = document.getElementById('input-pwd').value;
            msgEl.classList.add('hidden');
            await login(id, pwd, btnLogin, { textContent: '', classList: { remove: () => {}, add: () => {} } });
        });

        // Override login pour afficher l'erreur dans la banner
        const _loginOrig = login;
        // Redéfinir pour ce contexte
        document.getElementById('login-form').addEventListener('submit', () => {}, { once: true });

        form.onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('input-id').value.trim();
            const pwd = document.getElementById('input-pwd').value;
            msgEl.classList.add('hidden');

            const btnHTML = btnLogin.innerHTML;
            btnLogin.disabled = true;
            btnLogin.innerHTML = `<svg class="animate-spin h-5 w-5 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>`;

            try {
                const response = await fetch('http://localhost:8000/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifiant: id, mot_de_passe: pwd })
                });
                const data = await response.json();
                if (response.ok) {
                    sessionStorage.setItem('asecna_session', JSON.stringify(data));
                    window.location.href = 'index.html';
                } else {
                    msgText.textContent = data.detail || 'Identifiants incorrects.';
                    msgEl.classList.remove('hidden');
                    btnLogin.disabled = false;
                    btnLogin.innerHTML = btnHTML;
                }
            } catch {
                msgText.textContent = 'Erreur de connexion au serveur API (http://localhost:8000).';
                msgEl.classList.remove('hidden');
                btnLogin.disabled = false;
                btnLogin.innerHTML = btnHTML;
            }
        };

        // Demo buttons
        document.querySelectorAll('.demo-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.getElementById('input-id').value = btn.dataset.id;
                document.getElementById('input-pwd').value = btn.dataset.pwd;
                // Highlight
                document.getElementById('input-id').focus();
            });
        });

        // Toggle password visibility
        document.getElementById('toggle-pwd').addEventListener('click', () => {
            const inp = document.getElementById('input-pwd');
            inp.type = inp.type === 'password' ? 'text' : 'password';
        });
    </script>
</body>
</html>
